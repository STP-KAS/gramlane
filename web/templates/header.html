{{define "header"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body data-vault="{{.Vault}}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="nav">
    <a class="brand" href="/" title="Home">Gramlane</a>
    <nav>
      <a href="/kasdomain" class="{{if eq .Active "kasdomain"}}on{{end}}" title="Create a name">Name</a>
      <a href="/s/" class="{{if eq .Active "shop"}}on{{end}}" title="Open a name as a shop">Shops</a>
      <a href="/mine" class="{{if eq .Active "mine"}}on{{end}}">My names</a>
      <a href="/kachat" class="{{if eq .Active "kachat"}}on{{end}}" title="Find a name, open KaChat">Chat</a>
      <a href="/telegram" class="{{if eq .Active "telegram"}}on{{end}}" title="Encrypted notes paid in grams">Telegram</a>
      <a href="/prior" class="{{if eq .Active "prior"}}on{{end}}" title="Stamp a hash of a work">Prior</a>
      <a href="/pay" class="{{if or (eq .Active "pay") (eq .Active "jar")}}on{{end}}">Pay</a>
      <a href="/convert" class="{{if eq .Active "convert"}}on{{end}}">Convert</a>
    </nav>
    <a class="bal" href="/convert" data-balances hidden title="This wallet's KAS. Jar grams are the desk prepaid work pile, not this address.">
      <span data-kas-balance>KAS 0.0</span>
      <span data-gram-balance>jar 0 g</span>
    </a>
    <div class="who" data-who hidden>
      <button type="button" class="who-name" data-copy-who="name" title="Copy kasname">—</button>
      <button type="button" class="who-addr" data-copy-who="addr" title="Copy Kaspa address">—</button>
      <button type="button" class="btn ghost" data-change-name title="Same wallet. Pick another .kas shop.">Change name</button>
    </div>
    <button class="btn ghost" type="button" data-wallet-connect data-idle-label="Log in">Log in</button>
    <button class="btn ghost" type="button" data-wallet-logout hidden>Log out</button>
  </header>
{{end}}
