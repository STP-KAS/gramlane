{{define "header"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="nav">
    <a class="brand" href="/" title="Home">Gramlane</a>
    <nav>
      <a href="/kasdomain" class="{{if eq .Active "kasdomain"}}on{{end}}" title="Create a name">Name</a>
      <a href="/s/" class="{{if eq .Active "shop"}}on{{end}}" title="Open a name as a shop">Shops</a>
      <a href="/mine" class="{{if eq .Active "mine"}}on{{end}}">My names</a>
      <a href="/pay" class="{{if or (eq .Active "pay") (eq .Active "stablegram")}}on{{end}}">Pay</a>
    </nav>
    <button class="btn ghost" type="button" data-wallet-connect data-idle-label="Log in">Log in</button>
    <button class="btn ghost" type="button" data-wallet-logout hidden>Log out</button>
  </header>
{{end}}
