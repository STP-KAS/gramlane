{{define "header"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="/">GRAMLANE</a>
    <nav>
      <a href="/" class="{{if eq .Active "home"}}on{{end}}">Home</a>
      <a href="/spend" class="{{if eq .Active "spend"}}on{{end}}">Spend</a>
      <a href="/till" class="{{if eq .Active "till"}}on{{end}}">Till</a>
      <a href="/work" class="{{if eq .Active "work"}}on{{end}}">Work</a>
      <a href="/why" class="{{if eq .Active "why"}}on{{end}}">Why</a>
    </nav>
    <button class="btn ghost" type="button" data-wallet-connect data-idle-label="Log in">Log in</button>
    <button class="btn ghost" type="button" data-wallet-logout hidden>Log out</button>
    {{if .Seq}}<span class="chip">{{.Seq.Remaining}} GRAM</span>{{end}}
  </header>
{{end}}
